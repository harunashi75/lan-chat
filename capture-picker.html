<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source du partage</title>
<link rel="stylesheet" href="static/base.css">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{padding:24px 26px 8px}
  h1{margin:0 0 4px;font-size:21px;letter-spacing:-.5px}
  .lead{margin:0;color:var(--muted);font-size:13px}
  main{flex:1;overflow-y:auto;padding:8px 26px 18px}
  h2{margin:18px 0 10px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .source{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:20px;text-align:left;color:var(--text);
    background:var(--hover-bg);border:2px solid transparent;transition:.16s}
  .source:hover,.source:focus-visible{border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px)}
  .source img{width:100%;height:130px;object-fit:contain;border-radius:13px;background:#000}
  .source span{padding:0 4px 2px;font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  footer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 26px;border-top:1px solid var(--border);background:var(--modal-bg)}
  footer .media-switch{gap:18px}
</style>
</head>
<body>
<header>
  <h1>Choisir un écran ou une fenêtre</h1>
  <p class="lead">Seule la source choisie sera partagée.</p>
</header>
<main id="sources"></main>
<footer>
  <label class="media-switch" id="audioLabel" hidden>
    <span class="media-switch-copy">Inclure le son système<small>Disponible sous Windows</small></span>
    <input id="audio" type="checkbox" role="switch" checked><span class="switch-track" aria-hidden="true"></span>
  </label>
  <button class="btn-secondary" id="cancel" type="button">Annuler</button>
</footer>
<script>
document.body.classList.toggle('dark-mode', matchMedia('(prefers-color-scheme: dark)').matches);

function addGroup(title, sources, data) {
  if (!sources.length) return;
  const heading = document.createElement('h2');
  heading.textContent = title;
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const source of sources) {
    const button = document.createElement('button');
    button.className = 'source';
    button.type = 'button';
    const image = document.createElement('img');
    image.src = source.thumbnail;
    image.alt = '';
    const label = document.createElement('span');
    label.textContent = source.name;
    label.title = source.name;
    button.append(image, label);
    button.onclick = () => window.desktop.select({
      id: source.id, audio: data.audioAvailable && document.getElementById('audio').checked });
    grid.append(button);
  }
  document.getElementById('sources').append(heading, grid);
}

window.desktop.sources().then(data => {
  if (!data) return;
  document.getElementById('audioLabel').hidden = !data.audioAvailable;
  addGroup('Écrans', data.sources.filter(source => source.id.startsWith('screen:')), data);
  addGroup('Fenêtres', data.sources.filter(source => !source.id.startsWith('screen:')), data);
});
document.getElementById('cancel').onclick = () => window.desktop.select(null);
document.addEventListener('keydown', event => { if (event.key === 'Escape') window.desktop.select(null); });
</script>
</body>
</html>
