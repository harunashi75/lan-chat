<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LAN Chat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#4a45d6"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a6ff"/>
      <stop offset="1" stop-color="#a45be6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1b6b" flood-opacity=".32"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Second bubble (voice), peeking out behind -->
  <g filter="url(#shadow)">
    <rect x="236" y="64" width="212" height="160" rx="60" fill="url(#back)"/>
    <path d="M398 206 L430 276 L350 222 Z" fill="url(#back)"/>
  </g>

  <!-- Main chat bubble -->
  <g filter="url(#shadow)">
    <rect x="64" y="132" width="330" height="214" rx="76" fill="#fff"/>
    <path d="M128 326 L100 428 L222 340 Z" fill="#fff"/>
  </g>

  <!-- Three linked nodes: the local network -->
  <g stroke="#3b7df0" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M148 276 L229 196 L310 276 Z" stroke-linejoin="round"/>
  </g>
  <g fill="#3b7df0">
    <circle cx="148" cy="276" r="25"/>
    <circle cx="229" cy="196" r="25"/>
    <circle cx="310" cy="276" r="25"/>
  </g>
</svg>
